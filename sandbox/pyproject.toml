[project]
name = "pace-engine"
version = "0.1.0"
description = "Synvo enquiry engine for NTU PaCE (sandbox v1: engine only, mock data)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "google-genai>=1.20",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
msg = ["extract-msg>=0.48"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pace_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
