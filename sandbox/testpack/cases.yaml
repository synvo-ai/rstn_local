  - id: A7-01
    scenario: A7
    from: Rachel Lim
    subject: "Re: January intake for the Applied Data Analytics certificate"
    body: |
      Thank you for the quick reply. One more question: how much is the programme fee, and is it paid per module?

      Rachel
    quote_thread: true
    thread:
      - sentBy: SENDER
        from: Rachel Lim
        subject: January intake for the Applied Data Analytics certificate
        body: |
          Hello,

          When is the next intake for the Graduate Certificate in Applied Data Analytics, and when do applications close?

          Thank you,
          Rachel Lim
      - sentBy: PACE
        from: PaCE General Enquiries
        subject: "Re: January intake for the Applied Data Analytics certificate"
        body: |
          Dear Rachel,

          Thank you for your email. The next intake is in January 2027, and applications close on 15 November 2026.

          Best regards,
          PaCE General Enquiries
    expected:
      issues:
        - {action: REPLY_DIRECTLY, programme: GC-ADA, intent: FEES}

