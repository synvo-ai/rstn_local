# MOCK test emails (M4 seed) with expected results. All people, numbers and programmes are made up.
# tools/make_testpack.py turns each case into testpack/eml/<id>.eml (plus <id>.thread-N.eml for earlier
# messages, and <id>.form.json for web forms). Expected issues are matched by action and programme.
# programme: a programme ID, AMBIGUOUS, UNRESOLVED, or NOT_NEEDED.
cases:
  - id: A1-01
    scenario: A1
    from: Rachel Lim
    subject: January intake for the Applied Data Analytics certificate
    body: |
      Hello,

      When is the next intake for the Graduate Certificate in Applied Data Analytics, and when do applications close?

      Thank you,
      Rachel Lim
    expected:
      issues:
        - {action: REPLY_DIRECTLY, programme: GC-ADA, intent: SCHEDULE}

  - id: A1-02
    scenario: A1
    from: Marcus Tan
    subject: Fees for FlexiMasters in IC Design
    body: |
      Dear PaCE,

      Could you tell me how much the FlexiMasters in IC Design costs? Is it charged per module?

      Regards,
      Marcus
    expected:
      issues:
        - {action: REPLY_DIRECTLY, programme: FM-ICD, intent: FEES}

  - id: A1-03
    scenario: A1
    from: Nur Aisyah
    subject: Do I need programming experience?
    body: |
      Hi,

      I am interested in the Professional Certificate in Data Science and AI. I have a diploma in business but have never programmed. Can I still apply?

      Thanks
      Aisyah
    expected:
      issues:
        - {action: REPLY_DIRECTLY, programme: PC-DSAI, intent: ENTRY_REQUIREMENTS}

  - id: A2-01
    scenario: A2
    from: Priya Ramasamy
    subject: Payment not matched and question about the January intake
    body: |
      Dear PaCE team,

      I applied for the Graduate Certificate in Applied Data Analytics for the January 2027 intake and paid the course fee by bank transfer on 2 October. The learner portal now shows "Error 4021: Payment could not be matched to this application". Could you please check whether my payment has been received? My payment reference is PACE-GCADA-2026-11903.

      I would also like to know whether I can still use my SkillsFuture Credit for part of the fee, since I have already paid the full amount.

      Finally, when does the January intake start?

      Thank you,
      Priya Ramasamy
      Mobile: +65 9123 4567
    attachments:
      - {filename: bank_transfer_receipt.jpg, kind: receipt}
    expected:
      issues:
        - {action: MANUAL_HANDLING, programme: GC-ADA, intent: PAYMENT_STATUS}
        - {action: REPLY_DIRECTLY, programme: ANY, intent: FUNDING}
        - {action: REPLY_DIRECTLY, programme: GC-ADA, intent: SCHEDULE}

  - id: A2-02
    scenario: A2
    from: Daniel Koh
    subject: Sustainable finance diploma - a few questions
    body: |
      Good afternoon,

      I am considering the Specialist Diploma in Sustainable Finance. Three questions:
      1. What is the fee, and can it be paid in instalments?
      2. Which day of the week are the classes held?
      3. My company will sponsor me. What does my HR department need to submit, and by when?

      Best,
      Daniel Koh
    expected:
      issues:
        - {action: REPLY_DIRECTLY, programme: SD-SF, intent: FEES}
        - {action: REPLY_DIRECTLY, programme: SD-SF, intent: COURSE_INFORMATION}
        - {action: REPLY_DIRECTLY, programme: ANY, intent: FUNDING}

  - id: A3-01
    scenario: A3
    from: Marcus Tan
    subject: Credit for modules I completed at another university
    body: |
      Dear PaCE,

      I completed two postgraduate modules in analogue circuit design at another university in 2024. If I enrol in the FlexiMasters in IC Design, can these modules be credited so that I only need to take three modules? I can send my transcript.

      Regards,
      Marcus Tan
    expected:
      issues:
        - {action: REFER_TO_TEAM, programme: FM-ICD, owner: SCH-EEE, intent: CREDIT_TRANSFER}

